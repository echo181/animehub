<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>影视源 - AnimeHub</title>
    <link rel="stylesheet" href="css/style.css?v=8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
</head>
<body>
    <header class="header detail-header">
        <div class="header-inner">
            <button class="back-btn" onclick="location.href='index.html'">← 首页</button>
            <h1 class="header-title">📺 影视源</h1>
            <button class="source-mgr-btn" onclick="showConfigPanel()">⚙️ 源管理</button>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="搜索动漫名称..." onkeydown="if(event.key==='Enter')doSearch()">
            <button onclick="doSearch()" class="search-btn">🔍</button>
        </div>
        <!-- 当前源指示器 -->
        <div class="current-source-bar" id="currentSourceBar">
            <span class="current-source-label">当前源:</span>
            <select id="sourceSelector" class="source-selector" onchange="switchSource(this.value)"></select>
        </div>
    </header>

    <main class="main">
        <!-- 影视源选择 -->
        <div class="detail-section">
            <div class="section-header">
                <h3 class="section-title">📂 影视源站点</h3>
                <button class="btn-text" onclick="showConfigPanel()">+ 添加源</button>
            </div>
            <div id="siteList" class="source-site-list">
                <div class="loading-text">正在加载影视源...</div>
            </div>
        </div>

        <!-- 分类标签 -->
        <div id="categorySection" class="detail-section" style="display:none">
            <div class="category-tabs" id="categoryTabs"></div>
        </div>

        <!-- 搜索结果 / 分类列表 -->
        <div id="resultSection" class="detail-section">
            <h3 class="section-title" id="resultTitle">推荐内容</h3>
            <div id="videoGrid" class="anime-grid">
                <div class="empty-state">
                    <div class="empty-icon">📺</div>
                    <p>请选择上方影视源站点，或搜索动漫名称</p>
                </div>
            </div>
        </div>

        <!-- 观看历史 -->
        <div id="historySection" class="detail-section">
            <h3 class="section-title">🕘 观看历史</h3>
            <div id="historyList" class="history-list"></div>
        </div>
    </main>

    <!-- 视频详情弹窗 -->
    <div class="config-modal" id="detailModal" style="display:none">
        <div class="config-mask" onclick="hideDetailModal()"></div>
        <div class="config-content detail-modal-content">
            <button class="config-close" onclick="hideDetailModal()">✕</button>
            <div id="detailContent">
                <div class="loading-text">加载中...</div>
            </div>
        </div>
    </div>

    <!-- 配置管理弹窗 -->
    <div class="config-modal" id="configPanel" style="display:none">
        <div class="config-mask" onclick="hideConfigPanel()"></div>
        <div class="config-content">
            <button class="config-close" onclick="hideConfigPanel()">✕</button>
            <h2>⚙️ 影视源管理</h2>
            <div class="config-steps">
                <div class="config-step">
                    <div class="step-num">+</div>
                    <div>
                        <h3>添加 TVBox 配置源</h3>
                        <p>粘贴 TVBox/影视仓的 JSON 配置地址：</p>
                        <div class="add-source-form">
                            <input type="text" id="newConfigUrl" placeholder="https://example.com/tvbox.json" class="source-input">
                            <input type="text" id="newConfigName" placeholder="名称（可选）" class="source-input" style="margin-top:8px">
                            <button class="btn-primary" onclick="addConfig()" style="margin-top:8px">添加</button>
                        </div>
                        <div class="preset-sources">
                            <p style="margin-top:12px;font-size:12px;color:var(--text-secondary)">快捷添加：</p>
                            <button class="preset-btn" onclick="addPreset('tvbox-config.json', '默认源(本地)')">默认源(本地)</button>
                            <button class="preset-btn" onclick="addPreset('https://pastebin.com/raw/gtbKvnE1', 'Pastebin综合')">Pastebin综合</button>
                            <button class="preset-btn" onclick="addPreset('http://饭太硬.top/tv', '饭太硬')">饭太硬</button>
                            <button class="preset-btn" onclick="addPreset('https://qiaoji8.com/tvbox/json.json', '俏佳人')">俏佳人</button>
                            <button class="preset-btn" onclick="addPreset('http://hccx.top/tv', '荷城茶秀')">荷城茶秀</button>
                            <button class="preset-btn" onclick="addPreset('http://肥猫.com', '肥猫')">肥猫</button>
                            <button class="preset-btn" onclick="addPreset('https://yydsys.top/duo', '天天开心')">天天开心</button>
                            <button class="preset-btn" onclick="addPreset('https://0a.io/tv', '0a')">0a</button>
                        </div>
                    </div>
                </div>
                <div class="config-step" id="configListContainer">
                    <div class="step-num">📋</div>
                    <div style="flex:1">
                        <h3>已添加的源</h3>
                        <div id="configList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 播放器弹窗 -->
    <div class="player-modal" id="playerModal" style="display:none">
        <div class="player-modal-content">
            <div class="tvbox-player-wrap" id="tvboxPlayerWrap">
                <video id="tvboxPlayer" class="video-player" playsinline preload="metadata" webkit-playsinline></video>

                <!-- 加载中 -->
                <div class="loading-spinner" id="tvboxLoading" style="display:flex">
                    <div class="spinner"></div>
                </div>

                <!-- 错误提示 -->
                <div class="player-error" id="tvboxPlayerError" style="display:none">
                    <div class="error-icon">⚠️</div>
                    <div class="error-title">视频加载失败</div>
                    <div class="error-desc" id="tvboxErrorDesc"></div>
                    <button class="btn-primary" onclick="retryTvboxPlay()">🔄 重试</button>
                </div>

                <!-- 中央大播放按钮（暂停时显示） -->
                <div class="tvbox-center-play" id="tvboxCenterPlay" onclick="toggleTvboxPlay(event)">
                    <div class="center-play-icon">▶</div>
                </div>

                <!-- 快进/快退提示 -->
                <div class="tvbox-seek-indicator" id="tvboxSeekIndicator" style="display:none">
                    <span id="tvboxSeekIcon">⏪</span>
                    <span id="tvboxSeekTime">00:00</span>
                </div>

                <!-- 控制栏（自动隐藏） -->
                <div class="tvbox-controls" id="tvboxControls">
                    <!-- 顶部栏 -->
                    <div class="tvbox-controls-top">
                        <button class="tvbox-btn-close" onclick="hidePlayer()">✕</button>
                        <span class="tvbox-player-title" id="tvboxPlayerTitle"></span>
                        <div class="tvbox-top-right">
                            <button class="tvbox-btn" onclick="rotateTvboxScreen()" title="旋转屏幕">🔄</button>
                        </div>
                    </div>

                    <!-- 底部控件 -->
                    <div class="tvbox-controls-bottom">
                        <div class="tvbox-progress-wrap" id="tvboxProgressWrap">
                            <div class="tvbox-progress-buffered" id="tvboxProgressBuffered"></div>
                            <div class="tvbox-progress-played" id="tvboxProgressPlayed"></div>
                            <div class="tvbox-progress-thumb" id="tvboxProgressThumb"></div>
                        </div>
                        <div class="tvbox-time">
                            <span id="tvboxCurrentTime">00:00</span> / <span id="tvboxTotalTime">00:00</span>
                        </div>
                        <button class="tvbox-btn tvbox-btn-skip" onclick="tvboxSkip(-10)" title="快退10秒">⏪</button>
                        <button class="tvbox-btn tvbox-btn-play" id="tvboxPlayPauseBtn" onclick="toggleTvboxPlay()" title="播放/暂停">▶</button>
                        <button class="tvbox-btn tvbox-btn-skip" onclick="tvboxSkip(10)" title="快进10秒">⏩</button>
                        <select class="tvbox-speed-select" id="tvboxSpeedSelect" onchange="tvboxSetSpeed(this.value)" title="播放速度">
                            <option value="0.5">0.5x</option>
                            <option value="0.75">0.75x</option>
                            <option value="1" selected>1x</option>
                            <option value="1.25">1.25x</option>
                            <option value="1.5">1.5x</option>
                            <option value="2">2x</option>
                        </select>
                        <button class="tvbox-btn" id="tvboxFullscreenBtn" onclick="tvboxFullscreen()" title="全屏">⛶</button>
                        <button class="tvbox-btn" id="tvboxMuteBtn" onclick="tvboxToggleMute()" title="静音">🔊</button>
                    </div>
                </div>
            </div>

            <div class="player-modal-info">
                <h3 id="playerTitle" class="player-modal-title"></h3>
                <div class="episode-list" id="playerEpisodeList"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/tvbox.js?v=8"></script>
    <script src="js/tvbox-ui.js?v=8"></script>
</body>
</html>
